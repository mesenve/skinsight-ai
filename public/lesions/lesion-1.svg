<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="skin1" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#E8C4A8"/>
      <stop offset="100%" stop-color="#C99B7A"/>
    </radialGradient>
    <filter id="noise1">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="url(#skin1)"/>
  <rect width="400" height="400" fill="#000" opacity="0.03" filter="url(#noise1)"/>
  <ellipse cx="200" cy="210" rx="38" ry="32" fill="#6B3A2A" opacity="0.85"/>
  <ellipse cx="195" cy="205" rx="12" ry="10" fill="#4A2518" opacity="0.6"/>
  <ellipse cx="208" cy="215" rx="8" ry="6" fill="#8B5A3C" opacity="0.5"/>
</svg>
